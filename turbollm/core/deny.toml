[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
exceptions = [
    { allow = ["MPL-2.0"], crate = "uniffi" },
    { allow = ["MPL-2.0"], crate = "uniffi_bindgen" },
    { allow = ["MPL-2.0"], crate = "uniffi_build" },
    { allow = ["MPL-2.0"], crate = "uniffi_core" },
    { allow = ["MPL-2.0"], crate = "uniffi_internal_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_meta" },
    { allow = ["MPL-2.0"], crate = "uniffi_pipeline" },
    { allow = ["MPL-2.0"], crate = "uniffi_udl" },
]

# The workspace's own crates are FSL-1.1-ALv2 and never published (publish = false): only third-party licenses are checked.
[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
