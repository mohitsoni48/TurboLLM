name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job that runs tests has a timeout-minutes well above its normal time, and every daemon test step passes node
# --test-timeout=600000 (the unit step through package.json's "test" script): a test, or a test file whose process
# does not exit, then fails after 10 minutes with its name. A pid namespace left by pid1.test.ts under sudo held the
# unit job, and a hung file each tether job, for 2.5 hours until the run was cancelled, with no name in the log.
jobs:
  test:
    name: Typecheck & Unit tests
    runs-on: ubuntu-latest
    # About 6 minutes.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: turbollm/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: turbollm

      - name: Typecheck
        run: npm run typecheck
        working-directory: turbollm

      # code/search-tools.test.ts runs TurboLLM's grep and find against pi's own on real rg and fd (Debian names
      # it fdfind, which both look for); without them those cases are skipped. util/pid1.test.ts runs tini as PID 1
      # of a pid namespace (sudo -n unshare), as the Docker images do.
      - name: Install ripgrep, fd and tini
        run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find tini

      - name: Lint
        run: npm run lint
        working-directory: turbollm

      - name: Unit tests
        run: npm test
        working-directory: turbollm

  web:
    name: Web build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            turbollm/package-lock.json
            turbollm/web/package-lock.json

      # web/'s tsconfig resolves @types/node from turbollm/node_modules (web/ declares
      # none itself), exactly as the release builds run it — so install turbollm first.
      - name: Install daemon dependencies
        run: npm ci
        working-directory: turbollm

      - name: Install web dependencies
        run: npm ci
        working-directory: turbollm/web

      - name: Typecheck & build
        run: npm run build
        working-directory: turbollm/web

      - name: Unit tests
        run: npm test
        working-directory: turbollm/web

      # The npm package was first built by npm-publish.yml or desktop-release.yml, which run on
      # a published release, after the tag and the GitHub Release exist: a break in tsup.config.ts
      # or its post-build steps showed up only then. Built here from the web build above (`npm run
      # build` copies src/webdist into dist/), and its launcher run once.
      - name: Build the npm package
        run: npm run build
        working-directory: turbollm

      - name: The built CLI starts
        run: node bin/turbollm.mjs --help
        working-directory: turbollm

  # tsup.android.config.ts is a separate build pass whose only consumer is the APK, and
  # nothing in CI built it: the regression it fixes (bundling `puppeteer-core` dragged
  # @puppeteer/browsers' yargs in, whose ESM shim redeclares `__dirname` and made the phone
  # crash at boot) would have shipped unnoticed a second time. Runs on ubuntu because the
  # check is about the bundle's CONTENT, not about running it — the phone's Node 18 runtime
  # can't be reproduced here.
  android-bundle:
    name: Android bundle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: turbollm/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: turbollm

      - name: Build the Android bundle
        run: npx tsup --config tsup.android.config.ts
        working-directory: turbollm

      # Catches an ESM syntax error in an emitted chunk (the `__dirname` collision above was
      # one). It says nothing about the phone's older runtime: this is the CI host's node.
      - name: Every emitted chunk parses
        run: |
          for f in dist-android/*.js; do
            node --check "$f" || exit 1
          done
        working-directory: turbollm

      # The Code feature is cut from Android entirely; these chunks only appear when
      # something drags its dependency chain back in (verified by removing the `noExternal`
      # lookahead: puppeteer-core-*.js, bidi-*.js and yargs-*.js all reappear).
      - name: The Code feature's chunks stay out of the bundle
        run: |
          if ls -1 dist-android | grep -Eq 'puppeteer-core|bidi|yargs'; then
            echo "::error::the Android bundle contains Code-feature chunks"
            ls -1 dist-android
            exit 1
          fi
        working-directory: turbollm

  # scripts/release.mjs's guards (the publish gate, the merge and post-merge CI checks) have
  # their own tests, which no job ran: a break there showed up only during a release. They need
  # no install: each test builds a throwaway git repo and stubs gh and npm.
  release-script:
    name: Release script tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: node --test scripts/release.test.mjs

  # The External Chat API's TypeScript client is its own package, with its own lockfile.
  ts-client:
    name: TS client typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clients/ts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: clients/ts

      - name: Typecheck
        run: npm run typecheck
        working-directory: clients/ts

      - name: Unit tests
        run: npm test
        working-directory: clients/ts

  # util/tether.ts ties every child the daemon starts to the daemon's life. On macOS it rests on things the ubuntu
  # job cannot show: /bin/sh's own fd and job handling, SIP stripping DYLD_* from /bin/sh, libuv's posix_spawn PATH
  # walk (the resolver must name the program it runs), and the `ps` group counts that replace /proc. These run the
  # wrapper for real there and kill stand-in daemons. On Windows it rests on the job sentinel (PowerShell, Add-Type,
  # kernel32 jobs), the Git Bash gate and ConPTY, which only a Windows runner has.
  tether:
    name: Process tether (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A few minutes of tests on each OS.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: turbollm/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: turbollm

      - name: Install ripgrep and fd
        if: runner.os == 'macOS'
        run: brew install ripgrep fd

      - name: Tether tests
        if: runner.os == 'macOS'
        run: npx tsx --test --test-timeout=600000 src/util/tether.test.ts src/util/tether-lookup.test.ts src/engines/manager.tether.test.ts src/engines/manager.reap.test.ts src/remote/child-process.tether.test.ts src/routines/cli-process.tether.test.ts src/code/robust-bash.tether.test.ts src/code/code-routes.release.test.ts src/code/git.tether.test.ts src/code/agent-availability.tether.test.ts src/code/search-tools.test.ts src/tools/mcp-client.tether.test.ts src/code/lsp-client.tether.test.ts src/engines/build-runner.tether.test.ts src/engines/provision.tether.test.ts src/sysinfo/usage.tether.test.ts src/artifacts/screenshot.test.ts src/terminal/pty-session.tether.test.ts src/cli.keeper.test.ts src/util/boot-env.test.ts src/util/win-job-sentinel.test.ts
        working-directory: turbollm

      # The job sentinel for real (its jobs, its pid-reuse guard, its death, a failed end, its start time over 5 starts,
      # and the fallback with PowerShell hidden from PATH), a Git Bash `nohup … &` and a `cmd //c start //b` through
      # the gate, a ConPTY shell's job, node and PowerShell trees in a job and a breakaway that stays in it (refused
      # from the sentinel's own job, kept in it from Node's job nested inside it; a control case shows it leaving
      # without the sentinel), the protocol tests, and the restart keeper under ConPTY Ctrl+C on the real cli.ts.
      # Also the Code agent's rg/fd lookup against
      # libuv's own Windows spawn search (a copy of node.exe stands in for rg; the grep and find equivalence cases skip
      # without rg and fd, which this job does not install: the file passes without them, and its Windows lookup cases
      # are what it runs here for), and the export browser's Windows launch: the runner's
      # Chrome (Program Files\Google\Chrome\Application) spawned with its CDP pipe on fds 3 and 4.
      - name: Windows job sentinel and keeper tests
        if: runner.os == 'Windows'
        run: npx tsx --test --test-timeout=600000 src/util/win-job-sentinel.test.ts src/util/tether.test.ts src/util/boot-env.test.ts src/cli.keeper.test.ts src/code/search-tools.test.ts src/artifacts/screenshot.test.ts
        working-directory: turbollm

      # npmGlobalRoot builds cmd.exe's `npm root -g` line itself, as tetheredExecFile takes no `shell`. Every run holds
      # it to the line Node's own `shell: true` builds; on a Windows runner the real `npm root -g` runs through it.
      - name: npm root -g through the tether
        run: npx tsx --test --test-timeout=600000 --test-name-pattern="npm root -g" src/app-update-apply.test.ts
        working-directory: turbollm

      # A build step's Cancel and the daemon's exit send no taskkill once Node has seen the step exit: its pid may name
      # another process tree by then. Faked on every OS; on a Windows runner the step and what it leaves are real ones.
      - name: A build step that has exited gets no taskkill
        run: npx tsx --test --test-timeout=600000 --test-name-pattern="once the step has exited" src/engines/build-runner.test.ts
        working-directory: turbollm

      - name: A routine run's end releases its session's held jobs
        if: runner.os != 'Windows'
        run: npx tsx --test --test-timeout=600000 --test-name-pattern="left running|background jobs" src/routines/code-runner.test.ts
        working-directory: turbollm

      # The MLX engines provision on macOS only, so the ubuntu job skips their cases.
      - name: The MLX engines redo only an unfinished install
        if: runner.os == 'macOS'
        run: npx tsx --test --test-timeout=600000 src/engines/py-env-marker.test.ts
        working-directory: turbollm

  wrapper:
    name: Desktop wrapper unit tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: npm test
        working-directory: wrapper

  # NOTE: the standalone "telemetry-schema-hash" PR/push gate that used to live
  # here (ADR-331/333) was retired once `scripts/release.mjs`'s `preflight`
  # phase started enforcing the same check itself, with `--approved` able to
  # redeploy the Worker on the spot (see scripts/release.mjs). Duplicating the
  # gate on every ordinary PR to main added noise without adding safety: the
  # moment that actually matters is publish, and `preflight`/`publish` now
  # refuse to proceed on a schema/Worker mismatch. See docs/RELEASE.md.
