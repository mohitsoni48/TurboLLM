name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck & Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: turbollm/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: turbollm

      - name: Typecheck
        run: npm run typecheck
        working-directory: turbollm

      - name: Unit tests
        run: npm test
        working-directory: turbollm

  # NOTE: the standalone "telemetry-schema-hash" PR/push gate that used to live
  # here (ADR-331/333) was retired once `scripts/release.mjs`'s `preflight`
  # phase started enforcing the same check itself, with `--approved` able to
  # redeploy the Worker on the spot (see scripts/release.mjs). Duplicating the
  # gate on every ordinary PR to main added noise without adding safety: the
  # moment that actually matters is publish, and `preflight`/`publish` now
  # refuse to proceed on a schema/Worker mismatch. See docs/RELEASE.md.
