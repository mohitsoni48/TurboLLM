name: Desktop release

# Fires when RELEASE.md's `gh release create` step publishes a release (not on
# tag push — that would race the release object not existing yet for `gh
# release upload` to attach to). Builds native installers on each installer's
# own OS (a macOS dmg build must run on macOS) and uploads them onto that same
# release as assets.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  # The same zig and cargo-zigbuild core-build.yml cross-builds the linux-*-gnu core with (workflows.test.ts checks).
  ZIG_VERSION: 0.17.0
  CARGO_ZIGBUILD_VERSION: 0.24.1

jobs:
  build:
    # Guard against this ever firing for a release that isn't this repo's own
    # vX.Y.Z cut (RELEASE.md is the only thing that creates releases here).
    if: startsWith(github.event.release.tag_name, 'v')
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_glob: dist/*.exe
          - os: macos-latest
            artifact_glob: dist/*.dmg
          - os: ubuntu-latest
            artifact_glob: dist/*.AppImage

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: turbollm/package-lock.json

      - name: Install daemon dependencies
        run: npm ci
        working-directory: turbollm

      # The installer ships daemon/dist/native/turbollm-core.<host>.node (electron-builder.config.cjs), built here for
      # this runner's own target; `npm run build` stages it into dist/native/ (rust-core plan T23, ADR-465).
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
        working-directory: turbollm/core

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: turbollm/core

      # The AppImage keeps the glibc 2.28 floor (rust-core arch 2.3, ADR-465): a native build on ubuntu-latest would
      # link against the runner's newer glibc, so Linux cross-builds with zig pinned to the floor, as core-build.yml.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: ${{ runner.os == 'Linux' }}
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        if: ${{ runner.os == 'Linux' }}
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}

      - name: Build the native core
        run: npm run build:core ${{ runner.os == 'Linux' && '-- --target linux-x64-gnu --cross-compile' || '' }}
        working-directory: turbollm

      - name: Needs no glibc newer than 2.28
        if: ${{ runner.os == 'Linux' }}
        run: cargo xtask check-glibc --max 2.28 bindings/node/turbollm-core.linux-x64-gnu.node
        working-directory: turbollm/core

      - name: Build daemon + web UI
        run: |
          npm run build:web
          npm run build
        working-directory: turbollm

      - name: Install desktop wrapper dependencies
        run: npm ci
        working-directory: wrapper

      # The Electron app's own version is what electron-updater compares against
      # latest.yml. If wrapper/ drifts behind turbollm/ (it sat three minors
      # behind for months) the desktop app believes it is ahead of every
      # published release and never updates. Fail the build instead.
      - name: Assert wrapper/turbollm version lockstep
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            const read = p => JSON.parse(fs.readFileSync(p, 'utf8')).version;
            const daemon = read('turbollm/package.json');
            const wrapper = read('wrapper/package.json');
            if (daemon !== wrapper) {
              console.error('Version mismatch: turbollm/package.json is ' + daemon + ' but wrapper/package.json is ' + wrapper + '. They must be identical — the desktop app version is what electron-updater compares against latest.yml.');
              process.exit(1);
            }
            console.log('Version lockstep OK: ' + daemon);
          "

      - name: Package installer
        run: npm run package
        working-directory: wrapper

      # electron-builder only emits update manifests when a publish provider is
      # configured. If that config is ever dropped the installers still build
      # fine and auto-update silently dies — so assert the manifests exist.
      - name: Assert update manifests were generated
        shell: bash
        working-directory: wrapper
        run: |
          shopt -s nullglob
          manifests=(dist/latest*.yml)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No dist/latest*.yml produced — electron-updater cannot work without it. Check the publish: block in electron-builder.config.cjs." >&2
            ls -la dist || true
            exit 1
          fi
          printf 'update manifest: %s\n' "${manifests[@]}"

      - name: Upload installer to the release
        shell: bash
        working-directory: wrapper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # Fixed installer names (TurboLLM-Setup-x64.exe / TurboLLM-arm64.dmg /
          # TurboLLM-x86_64.AppImage) must keep uploading exactly as before —
          # /download links releases/latest/download/<fixed-name>.
          installers=(${{ matrix.artifact_glob }})
          if [ ${#installers[@]} -eq 0 ]; then
            echo "No installer matched ${{ matrix.artifact_glob }}" >&2
            exit 1
          fi
          # Update manifests + differential-download blockmaps for
          # electron-updater. Blockmaps do not exist for every target (AppImage
          # has none), hence nullglob rather than a hard requirement.
          manifests=(dist/latest*.yml dist/*.blockmap)
          gh release upload "${{ github.event.release.tag_name }}" "${installers[@]}" "${manifests[@]}" --clobber
