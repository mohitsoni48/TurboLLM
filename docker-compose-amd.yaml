services:
  turbollm:
    build:
      context: .
      dockerfile: Dockerfile.amd
    image: turbollm-amd:latest
    container_name: turbollm-amd
    # network_mode: "host" enables loopback (127.0.0.1) requests directly from the host,
    # allowing in-browser workspace and filesystem browsing (which is gated to local requests).
    network_mode: "host"
    volumes:
      # Persists config.json, the chat SQLite DB, downloaded engines/models, and logs
      # across container restarts/rebuilds (this is ~/.turbollm inside the container).
      # NOTE: the image seeds daemon.lanBind=true in this config.json, so the daemon's
      # default requireApiKey behavior actually enforces on this exposed port. Don't
      # flip lanBind back to false while this port is published — that reopens the
      # port to unauthenticated access.
      - turbollm-data:/root/.turbollm
      # Mount host directory so TurboLLM workspace browser and coding agents can access project files
      - ~/workspace:/root/workspace

    # --- AMD GPU passthrough (ROCm & Vulkan) ---
    # /dev/kfd is the ROCm kernel driver device; /dev/dri is the DRM/GPU device nodes.
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
      - "983" # host 'video' GID to ensure device permissions
      - "987" # host 'render' GID to ensure device permissions
    environment:
      # Consumer AMD GPUs & APUs (RX 6000/7000/Vega/Ryzen) often need HSA_OVERRIDE_GFX_VERSION
      # to prevent ROCm from throwing "HSA_STATUS_ERROR_INVALID_ISA / unsupported target":
      # - RDNA 2 (RX 6600/6700/etc): 10.3.0
      # - RDNA 3 (RX 7600/7700/etc): 11.0.0
      # - Vega / APU (Ryzen Cezanne/Renoir): 9.0.0
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6996/api/v1/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  turbollm-data:
    name: turbollm-data
